services:
  dulora:
    build: .
    container_name: dulora
    ports:
      - "${DULORA_PORT:-3000}:3000"
    volumes:
      - ./server/data:/app/data
    environment:
      - DULORA_JWT_SECRET=${DULORA_JWT_SECRET:-}
      - DULORA_INITIAL_PASSWORD=${DULORA_INITIAL_PASSWORD:-}
      - DULORA_TZ=${DULORA_TZ:-Asia/Shanghai}
    restart: unless-stopped
